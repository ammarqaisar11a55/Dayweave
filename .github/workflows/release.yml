name: Release

# A version tag creates a draft GitHub release and attaches the packages. Nothing becomes public
# until the draft is published by hand, and the Snap Store is a separate, manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches every version file
        run: |
          for version in \
            "$(node -p "require('./package.json').version")" \
            "$(node -p "require('./src-tauri/tauri.conf.json').version")" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; do
            test "v$version" = "$GITHUB_REF_NAME" || {
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
              exit 1
            }
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dayweave-core

  packages:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libssl-dev libxdo-dev patchelf file
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  snap:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: snapcraft
        uses: snapcore/action-build@v1
      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  draft:
    needs: [packages, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            "${prerelease[@]}" ./*.deb ./*.AppImage ./*.snap
