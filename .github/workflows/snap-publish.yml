name: Publish snap

# Publishes a snap that has already been built, without rebuilding it. It comes from a workflow run
# when one is given, and otherwise from the release. Run by hand, and the stable channel additionally
# needs approval through the `snap-stable` environment. It needs the SNAPCRAFT_STORE_CREDENTIALS
# secret. See DEVELOPMENT.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose snap to publish
        required: true
        default: v0.1.0
      run:
        description: ID of a workflow run to take the snap from instead
        required: false
      channel:
        description: Snap Store channel
        required: true
        default: edge
        type: choice
        options: [edge, beta, candidate, stable]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'stable' && 'snap-stable' || 'snap-prerelease' }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Check for store credentials
        run: |
          test -n "$SNAPCRAFT_STORE_CREDENTIALS" || {
            echo "::error::The SNAPCRAFT_STORE_CREDENTIALS secret is not set"
            exit 1
          }
      - name: Fetch the snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RUN: ${{ inputs.run }}
        run: |
          if [ -n "$RUN" ]; then
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name snap
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.snap'
          fi
      - run: sudo snap install snapcraft --classic
      - name: Upload and release
        env:
          CHANNEL: ${{ inputs.channel }}
        run: snapcraft upload --release="$CHANNEL" ./*.snap
