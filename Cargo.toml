[workspace]
resolver = "2"
members = ["crates/dayweave-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ammarqaisar11a55/Dayweave"
authors = ["Muhammad Ammar Qaisar"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
