[package]
name = "dayweave-core"
description = "Storage and product logic for Dayweave"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Serves the RPC dispatcher over HTTP on localhost for browser-based UI testing.
dev-bridge = []

[[bin]]
name = "dayweave-bridge"
path = "src/bin/bridge.rs"
required-features = ["dev-bridge"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.41", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
chrono-tz = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
